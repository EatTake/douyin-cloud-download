name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release metadata and tests
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          python -m py_compile scripts/setup.py skills/douyin-cloud-download/scripts/douyin_cloud.py
          python -m unittest discover -s skills/douyin-cloud-download/tests -p 'test_*.py'
      - name: Build source archives
        shell: bash
        run: |
          git archive --format=zip --prefix="douyin-cloud-download-${GITHUB_REF_NAME}/" -o "douyin-cloud-download-${GITHUB_REF_NAME}.zip" HEAD
          git archive --format=tar.gz --prefix="douyin-cloud-download-${GITHUB_REF_NAME}/" -o "douyin-cloud-download-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum douyin-cloud-download-${GITHUB_REF_NAME}.* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" douyin-cloud-download-${GITHUB_REF_NAME}.zip douyin-cloud-download-${GITHUB_REF_NAME}.tar.gz SHA256SUMS --title "${GITHUB_REF_NAME}" --generate-notes
